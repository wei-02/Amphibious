amphibious:
  # Joint State Controller
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  # Position Controllers for servo joints
  left_joint_position_controller:
    type: position_controllers/JointPositionController
    joint: left_joint
    pid: {p: 100.0, i: 0.01, d: 10.0}

  right_joint_position_controller:
    type: position_controllers/JointPositionController
    joint: right_joint
    pid: {p: 100.0, i: 0.01, d: 10.0}

  # Velocity Controllers for wheel joints
  front_left_wheel_velocity_controller:
    type: velocity_controllers/JointVelocityController
    joint: front_left_wheel_joint
    pid: {p: 50.0, i: 0.01, d: 5.0}

  front_right_wheel_velocity_controller:
    type: velocity_controllers/JointVelocityController
    joint: front_right_wheel_joint
    pid: {p: 50.0, i: 0.01, d: 5.0}

  back_left_wheel_velocity_controller:
    type: velocity_controllers/JointVelocityController
    joint: back_left_wheel_joint  
    pid: {p: 50.0, i: 0.01, d: 5.0}

  back_right_wheel_velocity_controller:
    type: velocity_controllers/JointVelocityController
    joint: back_right_wheel_joint  
    pid: {p: 50.0, i: 0.01, d: 5.0}

  gazebo_ros_control:
    pid_gains:
      left_joint:
        p: 100.0
        i: 0.5
        d: 0.0
      right_joint:
        p: 100.0
        i: 0.5
        d: 0.0
